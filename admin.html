<!DOCTYPE html>
<html lang="hy" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Մոդերացիա — Ջրհեղեղների հարթակ</title>
  <link rel="icon" href="assets/icons/GeoGeeks_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* The moderation queue is an ordinary document, not the map shell. */
    html, body { height: auto; overflow: auto; }
    body { padding: 22px 16px calc(40px + env(safe-area-inset-bottom)); }

    .admin-wrap { max-width: 640px; margin: 0 auto; }

    .admin-head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px;
    }
    .admin-head img { width: 36px; height: 36px; object-fit: contain; }
    .admin-head h1 { margin: 0; font-size: 19px; font-weight: 700; }
    .admin-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--c-text-muted); }

    .queue-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .queue-tag {
      display: inline-block;
      padding: 2px 9px;
      margin-bottom: 9px;
      border-radius: 999px;
      background: var(--c-accent-weak);
      color: var(--c-accent);
      font-size: 11.5px; font-weight: 700;
    }

    .queue-row { margin: 0 0 7px; font-size: 14px; line-height: 1.55; }
    .queue-row b { font-weight: 600; }
    .queue-row.muted { color: var(--c-text-muted); font-size: 12.5px; }

    .queue-videos { margin: 6px 0 0; padding-inline-start: 18px; font-size: 13px; }
    .queue-videos li { margin: 3px 0; overflow-wrap: anywhere; }
    .queue-videos a { color: var(--c-accent); }

    .queue-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .queue-actions .btn { flex: 1; min-width: 130px; height: 42px; }
    .btn-danger {
      background: var(--c-surface);
      border-color: var(--c-danger);
      color: var(--c-danger);
    }
    .btn-danger:hover:not(:disabled) { background: var(--c-danger-weak); }

    .state {
      text-align: center;
      padding: 40px 16px;
      color: var(--c-text-muted);
      font-size: 14px;
    }
    .state strong { display: block; font-size: 16px; color: var(--c-text); margin-bottom: 6px; }

    .flash {
      padding: 11px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      margin-bottom: 14px;
    }
    .flash-ok   { background: var(--c-accent-weak); color: var(--c-accent); }
    .flash-bad  { background: var(--c-danger-weak); color: var(--c-danger); }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <header class="admin-head">
      <img src="assets/icons/GeoGeeks_logo.png" alt="">
      <div>
        <h1>Մոդերացիայի հերթ</h1>
        <p id="queue-sub">Բեռնվում է...</p>
      </div>
    </header>

    <div id="flash" class="flash" hidden></div>
    <div id="queue"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/util.js"></script>
  <script>
  /* =============================================
     Moderation queue.

     The page is served from the site's own host because a Supabase Edge
     Function response is forced to text/plain and sandboxed by the gateway,
     so it can never render HTML. The function is used as a JSON API.

     The admin key stays in this page's own URL and is sent only to that API.
     ============================================= */

  var API = SUPABASE_URL + '/functions/v1/moderate';
  var params = new URLSearchParams(location.search);
  var adminKey = params.get('key') || '';
  var singleToken = params.get('token') || '';

  function flash(msg, ok) {
    var el = document.getElementById('flash');
    el.textContent = msg;
    el.className = 'flash ' + (ok ? 'flash-ok' : 'flash-bad');
    el.hidden = !msg;
  }

  function setState(html, sub) {
    document.getElementById('queue').innerHTML = html;
    if (sub !== undefined) document.getElementById('queue-sub').textContent = sub;
  }

  function videoList(videos) {
    if (!videos || !videos.length) return '<li>—</li>';
    return videos.map(function (v) {
      return '<li><a href="' + escHtml(v) + '" target="_blank" rel="noopener noreferrer">'
           + escHtml(v.length > 95 ? v.slice(0, 95) + '…' : v) + '</a></li>';
    }).join('');
  }

  function cardHtml(s) {
    var head;
    if (s.kind === 'addition') {
      head = '<span class="queue-tag">տեսանյութ առկա դեպքին</span>'
        + '<p class="queue-row"><b>Դեպքը.</b> ' + escHtml(s.target ? s.target.title : '—')
        + (s.target ? ' (' + escHtml(formatShortDate(s.target.event_date))
            + ', այժմ ' + s.target.video_count + ' տեսանյութ)' : '') + '</p>';
    } else {
      var place = [s.settlement, s.region].filter(Boolean).join(', ');
      head = '<span class="queue-tag">նոր դեպք</span>'
        + '<p class="queue-row"><b>Վերնագիր.</b> ' + escHtml(s.title) + '</p>'
        + '<p class="queue-row"><b>Ամսաթիվ.</b> ' + escHtml(formatShortDate(s.event_date)) + '</p>'
        + '<p class="queue-row"><b>Վայր.</b> ' + escHtml(place)
        + ' (' + escHtml(s.lat) + ', ' + escHtml(s.lng) + ')</p>'
        + (s.description ? '<p class="queue-row"><b>Նկարագրություն.</b> ' + escHtml(s.description) + '</p>' : '')
        + (s.source ? '<p class="queue-row"><b>Աղբյուր.</b> ' + escHtml(s.source) + '</p>' : '');
    }

    var who = (s.submitter_name || s.submitter_email)
      ? '<p class="queue-row muted">Ուղարկող՝ ' + escHtml(s.submitter_name || '')
        + ' ' + escHtml(s.submitter_email || '') + '</p>' : '';

    return '<div class="queue-card" data-token="' + escHtml(s.token) + '">'
      + head
      + '<p class="queue-row" style="margin-top:12px"><b>Տեսանյութեր.</b></p>'
      + '<ul class="queue-videos">' + videoList(s.videos) + '</ul>'
      + (s.submitter_note ? '<p class="queue-row"><b>Նշում.</b> ' + escHtml(s.submitter_note) + '</p>' : '')
      + who
      + '<p class="queue-row muted">Ուղարկվել է՝ ' + escHtml(String(s.created_at).slice(0, 16).replace('T', ' ')) + '</p>'
      + '<div class="queue-actions">'
      +   '<button class="btn btn-primary" data-action="approve">Հաստատել</button>'
      +   '<button class="btn btn-danger" data-action="reject">Մերժել</button>'
      + '</div></div>';
  }

  function render(list) {
    if (!list.length) {
      setState('<div class="state"><strong>Սպասող հայտեր չկան</strong>Ամեն ինչ մշակված է։</div>', '0 սպասող հայտ');
      return;
    }
    setState(list.map(cardHtml).join(''), list.length + ' սպասող հայտ');
  }

  function load() {
    if (!adminKey && !singleToken) {
      setState('<div class="state"><strong>Հասանելի չէ</strong>'
        + 'Բացեք այս էջը ձեր մոդերացիայի հասցեով (<code>?key=...</code>)։</div>', '');
      return;
    }

    var url = adminKey ? API + '?key=' + encodeURIComponent(adminKey)
                       : API + '?token=' + encodeURIComponent(singleToken);

    fetch(url, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json().then(function (b) { return { s: r.status, b: b }; }); })
      .then(function (res) {
        if (res.s === 403) {
          setState('<div class="state"><strong>Հասանելի չէ</strong>Սխալ հասցե։</div>', '');
          return;
        }
        if (res.s === 409) {
          setState('<div class="state"><strong>Այս հայտն արդեն մշակված է</strong>'
            + 'Ընթացիկ վիճակը՝ ' + escHtml(res.b.status || '') + '</div>', '');
          return;
        }
        if (res.s !== 200) throw new Error(res.b.error || ('HTTP ' + res.s));
        render(adminKey ? res.b.pending : [res.b.submission]);
      })
      .catch(function (err) {
        console.error(err);
        setState('<div class="state"><strong>Չհաջողվեց բեռնել</strong>'
          + 'Ստուգեք ինտերնետ կապը և թարմացրեք էջը։</div>', '');
      });
  }

  document.getElementById('queue').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;

    var card = btn.closest('.queue-card');
    var action = btn.dataset.action;
    if (action === 'reject' && !confirm('Մերժե՞լ այս հայտը։')) return;

    card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    btn.textContent = 'Ուղարկվում է...';

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: card.dataset.token, action: action, key: adminKey })
    })
      .then(function (r) { return r.json().then(function (b) { return { s: r.status, b: b }; }); })
      .then(function (res) {
        if (res.s === 200) {
          flash(action === 'approve'
            ? 'Հաստատվեց։ Տեղեկությունն այժմ երևում է քարտեզի վրա։'
            : 'Հայտը մերժվեց։', true);
        } else if (res.s === 409) {
          flash('Այս հայտն արդեն մշակված էր։', true);
        } else {
          throw new Error(res.b.error || ('HTTP ' + res.s));
        }
        card.remove();
        var left = document.querySelectorAll('.queue-card').length;
        document.getElementById('queue-sub').textContent = left + ' սպասող հայտ';
        if (!left) render([]);
      })
      .catch(function (err) {
        console.error(err);
        flash('Չհաջողվեց։ Փորձեք կրկին։', false);
        card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
        btn.textContent = action === 'approve' ? 'Հաստատել' : 'Մերժել';
      });
  });

  /* Match the map's theme preference. */
  try {
    var saved = localStorage.getItem('fip-theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}

  load();
  </script>
</body>
</html>
